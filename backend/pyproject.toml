[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["trucking/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"trucking/tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["trucking/domain", "trucking/services"]
plugins = []
ignore_missing_imports = true

[tool.coverage.run]
source = ["trucking"]
omit = ["trucking/tests/*"]
